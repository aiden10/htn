<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeLife Badge Bridge</title>
<style>
body{max-width:720px;margin:32px auto;padding:0 16px;background:#13212b;color:#e8f3fa;font:16px system-ui,sans-serif}h1{margin-bottom:4px}p{color:#b9d0dc;line-height:1.45}button,select{font:inherit;padding:9px 12px;margin:5px 6px 5px 0}button{background:#327896;color:white;border:0;border-radius:5px}button:disabled{opacity:.5}select{border-radius:5px}#state{padding:10px;background:#203540;border-radius:5px}pre{height:230px;overflow:auto;white-space:pre-wrap;background:#0b1218;padding:12px;border-radius:5px;color:#c9e6f2}
</style>
<h1>PokeLife badge bridge</h1>
<p>Use Chrome or Edge. Close the Hack the North IDE first: only one page can hold the badge’s serial port.</p>
<p>Start the FastAPI server, open this page at <code>http://127.0.0.1:8000/bridge</code>, then choose the badge’s <em>USB JTAG/serial debug unit</em>.</p>
<label>World <select id="world"><option value="/simulation/test">Test world</option><option value="">Live world</option></select></label><br>
<button id="connect">Connect badge</button><button id="push" disabled>Publish now</button><button id="watch" disabled>Start watch</button><button id="close" disabled>Disconnect</button>
<div id="state">Not connected.</div><pre id="log"></pre>
<script>
const E=new TextEncoder(),D=new TextDecoder(),$=id=>document.getElementById(id);
let port,reader,writer,watchTimer,busy=false,lastRevision=-1,buffer="";
function log(x){$("log").textContent+=(x+"\n");$("log").scrollTop=$("log").scrollHeight}
function state(x){$("state").textContent=x}const nap=ms=>new Promise(r=>setTimeout(r,ms));
async function send(bytes){await writer.write(typeof bytes==="string"?E.encode(bytes):bytes)}
async function sendRaw(bytes){for(let i=0;i<bytes.length;i+=32){await send(bytes.slice(i,i+32));await nap(8)}}
async function until(mark,timeout=12000){
 const end=Date.now()+timeout;while(Date.now()<end){const read=reader.read(),timer=nap(Math.max(1,end-Date.now())).then(()=>({timeout:true})),got=await Promise.race([read,timer]);if(got.timeout)throw Error(`Timed out waiting for ${mark}`);if(got.done)throw Error("Badge disconnected.");buffer+=D.decode(got.value,{stream:true});if(buffer.includes(mark)){const out=buffer;buffer="";return out}}throw Error(`Timed out waiting for ${mark}`)
}
async function waitForConsole(){
 state("Waiting for the badge console...");await nap(3000);await send("\n");await until("badge>",8000)
}
async function connect(){
 if(!("serial" in navigator))throw Error("This browser does not support Web Serial. Use Chrome or Edge.");state("Choose the USB JTAG/serial debug unit...");port=await navigator.serial.requestPort();await port.open({baudRate:115200,bufferSize:1024});reader=port.readable.getReader();writer=port.writable.getWriter();buffer="";await waitForConsole();$("push").disabled=$("watch").disabled=$("close").disabled=false;$("connect").disabled=true;state("Connected. Ready to publish.");log("Connected.")
}
function revision(x){const m=x.match(/(?:^|\n)revision=(\d+)(?:\n|$)/);if(!m)throw Error("Server response has no revision.");return Number(m[1])}
async function snapshot(){
 const base=$("world").value,[a,b]=await Promise.all([fetch(base+"/badge/inbox"),fetch(base+"/badge/ready")]);if(!a.ok||!b.ok)throw Error("Could not fetch the server snapshot.");const[inbox,ready]=await Promise.all([a.text(),b.text()]);if(revision(inbox)!==revision(ready))throw Error("Server returned mismatched inbox revisions.");return{inbox,ready,revision:revision(ready)}
}
async function put(file,text){
 const bytes=E.encode(text),path="/littlefs/apps/pokedex/"+file;log(`Writing ${file} (${bytes.length} bytes)...`);await send(`put ${path} ${bytes.length}\n`);await until("READY",8000);await nap(350);await sendRaw(bytes);await until(`OK ${bytes.length}`,35000)
}
async function publish(force=true){
 if(busy)return;busy=true;try{const x=await snapshot();if(!force&&x.revision<=lastRevision)return;state(`Publishing revision ${x.revision}...`);await put("inbox.tmp",x.inbox);await put("inbox.ready",x.ready);lastRevision=x.revision;state(`Published revision ${x.revision}. PokeLife will see it within one second.`);log("Publish complete.")}catch(err){state("Publish failed: "+err.message);log("ERROR: "+err.message)}finally{busy=false}
}
async function close(){
 clearInterval(watchTimer);watchTimer=null;$("watch").textContent="Start watch";try{if(reader)reader.releaseLock();if(writer)writer.releaseLock();if(port)await port.close()}catch(err){log("Disconnect: "+err.message)}port=reader=writer=null;$("push").disabled=$("watch").disabled=$("close").disabled=true;$("connect").disabled=false;state("Disconnected.")
}
$("connect").onclick=()=>connect().catch(e=>{state("Connection failed: "+e.message);log("ERROR: "+e.message);close()});$("push").onclick=()=>publish();$("watch").onclick=()=>{if(watchTimer){clearInterval(watchTimer);watchTimer=null;$("watch").textContent="Start watch";log("Watch stopped.")}else{publish(false);watchTimer=setInterval(()=>publish(false),1000);$("watch").textContent="Stop watch";log("Watching for newer revisions.")}};$("close").onclick=close;
</script>
